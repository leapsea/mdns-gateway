name: Build and publish mDNS Gateway

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# 发布串行执行，避免并发构建交错覆盖 latest。
concurrency:
  group: mdns-gateway-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify source and frontend
        run: sh scripts/check-local.sh

  publish-ghcr:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # containerd 支持加载完整的多架构索引，检查与发布共用同一份镜像。
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image identity
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # 禁用标签推断的 latest，只有 main 和稳定版本可以更新它。
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
      - name: Build multi-architecture test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true
          tags: |
            mdns-gateway-smoke:tested
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mdns-gateway-multiarch
          cache-to: type=gha,scope=mdns-gateway-multiarch,mode=max
      - name: Verify amd64 container
        env:
          MDNS_GATEWAY_SKIP_BUILD: '1'
          MDNS_GATEWAY_IMAGE_TAG: mdns-gateway-smoke:tested
          MDNS_GATEWAY_PLATFORM: linux/amd64
        run: sh scripts/check-container.sh
      - name: Verify arm64 container
        env:
          MDNS_GATEWAY_SKIP_BUILD: '1'
          MDNS_GATEWAY_IMAGE_TAG: mdns-gateway-smoke:tested
          MDNS_GATEWAY_PLATFORM: linux/arm64
        run: sh scripts/check-container.sh
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multi-architecture image
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        # 推送已检查的完整索引，不在检查后重新构建。
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$PUBLISH_TAGS"
