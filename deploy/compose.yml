services:
  mdns-gateway:
    image: mdns-gateway:local
    build: ..
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      GATEWAY_LISTEN: ":${GATEWAY_HTTP_PORT:-8082}"
      GATEWAY_DATA_DIR: /data
      GATEWAY_OPENRESTY_BIN: openresty
      GATEWAY_IPV4: "${GATEWAY_IPV4:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${GATEWAY_HTTP_PORT:-8082}/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
